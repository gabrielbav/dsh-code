# dsh-code bundle patch.
#
# Host plane: `code-workspaces` owns Docker + gVisor workspaces and serves the
# Code UI's Remote API; its client half (`./client`) adds the Chat | Code
# switch, repository and branch pickers, status line and session actions.
#
# Agent plane: the `code` preset keeps the chat experience of the standard
# preset and swaps execution. `code-execution` isolates `subprocess`, `shell`
# and `fs`, so bash, search and the file tools inside it see only the
# container-backed process runtime and the container-backed filesystem.
# In-process subagents (spawn and fork) compose from the parent's preset
# generation, so children run in the same container. Tools that would act
# from the host on the agent's behalf are left out: out-of-process subagent
# providers (SDK, Claude Code, Codex, ACP), workflows, web fetch (host
# network), office documents, and plugin management.
- insert:
    - id: code-workspaces
      name: '@gabrielbav/dsh-code'

    - id: preset-code
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code
        name: Code
        description: Coding in an isolated Docker + gVisor workspace with its own branch
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model. You work in an isolated checkout of the user's repository on a dedicated branch; commands and file edits run inside that sandbox.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: code-execution
            name: cordis:group
            group: true
            isolate:
              subprocess: true
              shell: true
              fs: true
            config:
              - id: code-subprocess
                name: '@gabrielbav/dsh-code/subprocess'
              - id: code-fs
                name: '@gabrielbav/dsh-code/fs'
              - id: code-bash
                name: '@deepseek-ai/dsh-bash-local'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
                config:
                  applyPatch: false
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  sampleOverCapGlobResults: false
          # Skill folders inside the checkout are read through the container
          # fs; host-side watchers would follow sandbox-controlled links.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              watch: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: subagent
            name: '@deepseek-ai/dsh-subagent'
          - id: subagent-spawn-in-process
            name: '@deepseek-ai/dsh-subagent-spawn-in-process'
            config:
              providerName: spawn
          - id: subagent-fork-in-process
            name: '@deepseek-ai/dsh-subagent-fork-in-process'
            config:
              providerName: fork
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
          # No agentPreset/allowedAgentPresets: the model cannot pick another
          # preset, so every child inherits `code` and its container.
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000
